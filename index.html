<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="卜卜">
<meta name="theme-color" content="#f57c00">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="bubu-icon.png">
<title>🥕 卜卜桌面宠物</title>
<style>
:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --lyric-font-size: 15px;
  --lyric-color: #fff;
  --lyric-bg: rgba(0,0,0,.75);
  --lyric-scale: 1;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; height: 100dvh; overflow: hidden;
  position: fixed; inset: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none; user-select: none;
  touch-action: manipulation;
}
.wallpaper {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse at 20% 30%, rgba(255,183,77,0.15) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(129,199,132,0.12) 0%, transparent 50%),
    linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
}
.stage { position: fixed; inset: 0; z-index: 1; }
/* 作者水印 */
.watermark {
  position: fixed; bottom: calc(80px + var(--safe-bottom)); right: 16px;
  z-index: 1; pointer-events: none;
  font-size: 10px; color: rgba(0,0,0,.08);
  font-weight: 500; letter-spacing: 1px;
  writing-mode: vertical-rl; text-orientation: mixed;
}
.concert-mode-stage { z-index: 8 !important; }
.bubu {
  position: absolute; width: 140px; height: 186px;
  left: 50%; top: 50%; transform: translate(-50%,-50%);
  cursor: grab; z-index: 15; touch-action: none;
}
.bubu:active { cursor: grabbing; }
.bubu.dragging { transform: translate(-50%,-50%) scale(1.1); z-index: 100; }
.bubu img {
  width: 100%; height: 100%; object-fit: contain;
  pointer-events: none; -webkit-user-drag: none;
  filter: drop-shadow(0 8px 20px rgba(0,0,0,0.12));
}
.bubu.flip-x img { transform: scaleX(-1); }
@keyframes float {
  0%,100% { transform: translate(-50%,-50%) translateY(0); }
  50% { transform: translate(-50%,-50%) translateY(-6px); }
}
.bubu.idle { animation: float 2.5s ease-in-out infinite; }
@keyframes bounce {
  0%,100% { transform: translate(-50%,-50%) translateY(0) scale(1,1); }
  25% { transform: translate(-50%,-50%) translateY(-25px) scale(.95,1.05); }
  50% { transform: translate(-50%,-50%) translateY(0) scale(1.05,.95); }
  75% { transform: translate(-50%,-50%) translateY(-12px) scale(.98,1.02); }
}
.bubu.bouncing { animation: bounce .6s ease; }
.bubu.dragging,.bubu.dragging.idle,.bubu.dragging.bouncing { animation: none !important; }
.bubble {
  position: absolute; top: -15px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: rgba(0,0,0,.78); color: #fff;
  font-size: 12px; font-weight: 500;
  padding: 6px 13px; border-radius: 15px;
  white-space: nowrap; opacity: 0; pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  max-width: 75vw; overflow: hidden; text-overflow: ellipsis;
}
.bubble.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.bubu.concert-mode .bubble {
  white-space: normal; text-align: center;
  max-width: 70vw; min-width: 40px;
  word-break: keep-all;
}
.bubble::after {
  content: ''; position: absolute; bottom: -5px; left: 50%;
  transform: translateX(-50%);
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 6px solid rgba(0,0,0,.78);
}
.zzz { position: absolute; top: -5px; right: 0; opacity: 0; pointer-events: none; }
.bubu.sleeping .zzz { opacity: 1; }
.zzz span {
  position: absolute; color: #64b5f6; font-weight: 800;
  font-family: 'SF Pro Rounded', sans-serif;
  animation: zzzUp 2s ease-in-out infinite;
}
.zzz span:nth-child(1) { font-size: 12px; right: 15px; top: 0; animation-delay: 0s; opacity: .5; }
.zzz span:nth-child(2) { font-size: 15px; right: 5px; top: -12px; animation-delay: .4s; opacity: .7; }
.zzz span:nth-child(3) { font-size: 19px; right: -8px; top: -26px; animation-delay: .8s; opacity: .9; }
@keyframes zzzUp {
  0%,100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-10px) scale(1.15); }
}
.hearts { position: absolute; top: 10px; left: 50%; pointer-events: none; }
.heart {
  position: absolute; font-size: 18px;
  animation: heartFly 1.3s ease-out forwards;
}
@keyframes heartFly {
  0% { transform: translate(-50%,0) scale(.4); opacity: 1; }
  100% { transform: translate(var(--tx),-60px) scale(1.2); opacity: 0; }
}
.food {
  position: absolute; font-size: 20px;
  animation: foodDrop .8s ease-in forwards;
}
@keyframes foodDrop {
  0% { transform: translate(-50%,-80px) scale(.5); opacity: 1; }
  100% { transform: translate(-50%,10px) scale(1); opacity: 0; }
}
.toolbar {
  position: fixed; bottom: calc(28px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
  display: flex; gap: 12px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 10px 16px; border-radius: 24px;
  box-shadow: 0 4px 24px rgba(0,0,0,.1); z-index: 50;
}
.tool-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none; padding: 7px 12px; border-radius: 16px;
  transition: all .15s; -webkit-tap-highlight-color: transparent;
}
.tool-btn:active { background: rgba(255,152,0,.15); transform: scale(.95); }
.tool-btn .icon { font-size: 22px; line-height: 1; }
.tool-btn .label { font-size: 10px; color: #777; font-weight: 600; white-space: nowrap; }
.status-panel {
  position: fixed; top: calc(50px + var(--safe-top)); right: 14px;
  background: rgba(255,255,255,.88);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 16px; padding: 11px 14px;
  box-shadow: 0 2px 14px rgba(0,0,0,.08); z-index: 50;
  display: flex; flex-direction: column; gap: 7px; min-width: 110px;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
}
.status-panel.dragging { cursor: grabbing; opacity: .9; z-index: 200; }
.status-panel .drag-handle {
  text-align: center; font-size: 8px; color: #ccc; line-height: 1;
  margin-bottom: 2px; cursor: grab; letter-spacing: 2px;
}
.row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #555; gap: 10px; }
.bar { width: 75px; height: 5px; background: #e0e0e0; border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
.bar-fill.mood { background: linear-gradient(90deg, #ffb74d, #81c784); }
.bar-fill.full { background: linear-gradient(90deg, #ff9800, #aed581); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.35);
  z-index: 200; opacity: 0; pointer-events: none; transition: opacity .25s;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-sheet {
  background: #fff; border-radius: 26px 26px 0 0;
  padding: 24px 20px 34px; width: 100%; max-width: 500px;
  transform: translateY(100%);
  transition: transform .35s cubic-bezier(.32,.72,0,1);
}
.modal-overlay.open .modal-sheet { transform: translateY(0); }
.modal-title { text-align: center; font-size: 17px; font-weight: 700; color: #333; margin-bottom: 20px; }
.dress-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; }
@media (max-width: 480px) {
  .dress-grid { grid-template-columns: repeat(2,1fr); }
}
.dress-item {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 14px 4px; border-radius: 16px; border: 2px solid #f0f0f0;
  background: #fafafa; transition: all .2s; cursor: pointer;
}
.dress-item.active { border-color: #ff9800; background: rgba(255,152,0,.08); }
.dress-item .emoji { font-size: 28px; }
.dress-item .name { font-size: 10px; color: #666; }
.hint {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  z-index: 150;
  background: rgba(255,255,255,.95);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 20px 22px; border-radius: 20px;
  box-shadow: 0 8px 40px rgba(0,0,0,.15);
  font-size: 13px; color: #555; line-height: 1.8;
  max-width: 300px; text-align: center;
  transition: opacity .4s;
}
.hint.fade-out { opacity: 0; pointer-events: none; }
.hint .hint-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 12px; }
.hint .hint-step { text-align: left; margin: 4px 0; padding-left: 6px; }
.hint .hint-close {
  margin-top: 14px; padding: 8px 24px;
  background: #ff9800; color: #fff; border: none;
  border-radius: 12px; font-size: 14px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.hint .hint-close:active { background: #f57c00; transform: scale(.95); }
.music-ctrl {
  position: fixed; top: calc(52px + var(--safe-top)); left: 50%; transform: translateX(-50%);
  z-index: 40;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 6px 14px; border-radius: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  display: flex; align-items: center; gap: 6px;
  cursor: pointer; transition: all .2s;
}
.music-ctrl.playing { background: rgba(255,152,0,.12); border: 1px solid rgba(255,152,0,.3); }
.music-icon { font-size: 18px; }
.music-label { font-size: 11px; color: #777; font-weight: 500; }
.music-ctrl.playing .music-label { color: #e65100; }
.play-mode-toggle {
  display: inline-flex; align-items: center; gap: 4px;
  margin: 0 auto 14px; padding: 5px 14px; border-radius: 12px;
  background: rgba(255,152,0,.08); border: 1px solid rgba(255,152,0,.2);
  font-size: 11px; color: #e65100; cursor: pointer;
  transition: all .2s; white-space: nowrap;
}
.play-mode-toggle:active { background: rgba(255,152,0,.15); transform: scale(.95); }
.volume-bar-wrap {
  position: fixed; top: calc(94px + var(--safe-top)); left: 50%; transform: translateX(-50%);
  z-index: 40;
  background: rgba(255,255,255,.85);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  padding: 8px 14px; border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  display: none; align-items: center; gap: 8px;
}
.volume-bar-wrap.show { display: flex; }
.volume-bar-wrap input[type=range] {
  width: 100px; height: 4px;
  -webkit-appearance: none; appearance: none;
  background: #ddd; border-radius: 2px; outline: none;
}
.volume-bar-wrap input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 16px; height: 16px; border-radius: 50%;
  background: #ff9800; cursor: pointer;
}
.volume-val { font-size: 10px; color: #999; min-width: 28px; text-align: center; }
.audio-file-input { display: none; }
.concert-overlay {
  position: fixed; inset: 0; z-index: 5;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.6) 0%, rgba(0,0,0,.85) 100%);
  opacity: 0; pointer-events: none; transition: opacity .6s;
}
.concert-overlay.on { opacity: 1; }
.spotlight {
  position: absolute; bottom: 50%; left: 50%; transform: translate(-50%,0);
  width: 200px; height: 300px;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,200,100,.25) 0%, transparent 70%);
  pointer-events: none;
  animation: spotlightSway 3s ease-in-out infinite;
}
@keyframes spotlightSway {
  0%,100% { transform: translate(-50%,0) rotate(-3deg); }
  50% { transform: translate(-50%,0) rotate(3deg); }
}
.stage-lights { position: fixed; inset: 0; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .5s; }
.stage-lights.on { opacity: 1; }
.light-beam {
  position: absolute; bottom: 0;
  width: 40px; height: 50vh;
  opacity: .35; transform-origin: bottom center;
  animation: beamSpin 2s linear infinite;
}
@keyframes beamSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.light-beam:nth-child(1) { left: 10%; background: linear-gradient(to top, #ff1744, transparent); animation-delay: 0s; animation-duration: 3s; }
.light-beam:nth-child(2) { left: 30%; background: linear-gradient(to top, #00e5ff, transparent); animation-delay: .6s; animation-duration: 3.5s; }
.light-beam:nth-child(3) { left: 50%; background: linear-gradient(to top, #ffea00, transparent); animation-delay: 1.2s; animation-duration: 4s; }
.light-beam:nth-child(4) { left: 70%; background: linear-gradient(to top, #d500f9, transparent); animation-delay: .3s; animation-duration: 2.8s; }
.light-beam:nth-child(5) { left: 90%; background: linear-gradient(to top, #76ff03, transparent); animation-delay: .9s; animation-duration: 3.2s; }
.music-notes { position: fixed; inset: 0; z-index: 7; pointer-events: none; }
.note-particle {
  position: absolute; font-size: 24px; opacity: 0;
  animation: noteFloat 3s ease-out forwards;
}
@keyframes noteFloat {
  0% { transform: translateY(0) scale(.5); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-200px) translateX(var(--nx)) scale(1.2) rotate(var(--nr)); opacity: 0; }
}
.microphone {
  position: absolute; z-index: 12; pointer-events: none;
  opacity: 0; transition: opacity .3s;
  display: flex; flex-direction: column; align-items: center;
}
.microphone.show { opacity: 1; }
.mic-head {
  width: 14px; height: 18px;
  background: linear-gradient(135deg, #424242, #212121);
  border-radius: 50%;
  border: 2px solid #616161;
  position: relative;
}
.mic-head::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 6px; height: 8px;
  background: rgba(255,255,255,.3);
  border-radius: 50%;
}
.mic-handle {
  width: 5px; height: 16px;
  background: linear-gradient(180deg, #757575, #424242);
  border-radius: 0 0 3px 3px;
}
.bubu.concert-mode img {
  animation: concertBounce .4s ease infinite alternate;
}
@keyframes concertBounce {
  0% { transform: scale(1) rotate(-2deg); }
  100% { transform: scale(1.05) rotate(2deg); }
}
.crowd { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; z-index: 7; pointer-events: none; opacity: 0; transition: opacity .5s; }
.crowd.on { opacity: 1; }
.glowstick {
  position: absolute; bottom: 10px;
  width: 3px; height: 30px; border-radius: 2px;
  animation: glowWave 1s ease-in-out infinite;
}
@keyframes glowWave {
  0%,100% { transform: scaleY(1); opacity: .6; }
  50% { transform: scaleY(.6); opacity: 1; }
}

/* ===== 歌词气泡（非演唱会模式，可拖拽，支持整体缩放） ===== */
.lyric-bubble {
  position: fixed; bottom: 50%; left: 50%;
  z-index: 20;
  background: var(--lyric-bg); color: var(--lyric-color);
  font-size: calc(var(--lyric-font-size) * var(--lyric-scale));
  font-weight: 600; text-align: center;
  padding: calc(10px * var(--lyric-scale)) calc(24px * var(--lyric-scale));
  border-radius: calc(22px * var(--lyric-scale));
  opacity: 0; transition: opacity .4s;
  max-width: 88vw;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: inline-block; width: max-content;
}
.lyric-bubble.show { opacity: 1; }
.lyric-bubble.dragging { cursor: grabbing; opacity: .85; z-index: 200; }
.lyric-bubble.concert-hidden { display: none !important; }
.lyric-settings {
  position: fixed; z-index: 21;
  background: rgba(255,255,255,.92);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border-radius: 14px; padding: 10px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,.12);
  display: none; flex-wrap: wrap; gap: 8px; align-items: center;
  font-size: 11px; color: #666;
}
.lyric-settings.show { display: flex; }
.lyric-settings label { font-weight: 500; white-space: nowrap; }
.lyric-settings input[type=range] { width: 60px; height: 3px; -webkit-appearance: none; appearance: none; background: #ddd; border-radius: 2px; }
.lyric-settings input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%; background: #ff9800; cursor: pointer; }
.lyric-settings .color-swatch {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid #ddd; cursor: pointer; transition: border-color .15s;
  position: relative; overflow: hidden;
}
.lyric-settings .color-swatch:active { border-color: #ff9800; }
.lyric-settings .color-swatch input[type=color] {
  position: absolute; inset: -4px; width: calc(100% + 8px); height: calc(100% + 8px);
  cursor: pointer; opacity: 0;
}
.lyric-settings .scale-btn {
  width: 26px; height: 26px; border-radius: 50%;
  border: 2px solid #ddd; background: #f5f5f5;
  font-size: 16px; font-weight: 700; color: #666;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all .15s; line-height: 1;
}
.lyric-settings .scale-btn:active { border-color: #ff9800; background: rgba(255,152,0,.1); }
.lyric-settings .scale-val {
  font-size: 11px; color: #333; font-weight: 600; min-width: 32px; text-align: center;
}

/* ===== 歌曲选择弹窗 ===== */
.song-list {
  display: flex; flex-direction: column; gap: 8px;
  max-height: 60vh; overflow-y: auto; padding: 4px 0;
}
.song-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 14px;
  border: 2px solid #f0f0f0; background: #fafafa;
  cursor: pointer; transition: all .2s; text-align: left;
  position: relative; overflow: hidden;
}
.song-item:active { background: rgba(255,152,0,.08); }
.song-item.playing { border-color: #ff9800; background: rgba(255,152,0,.1); }
.song-item .song-icon { font-size: 24px; }
.song-item .song-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.song-item .song-title { font-size: 14px; font-weight: 600; color: #333; }
.song-item .song-artist { font-size: 11px; color: #999; }
.song-item .song-status { font-size: 12px; color: #ff9800; }
/* 删除按钮 */
.song-item .delete-btn {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  width: 28px; height: 28px; border-radius: 50%;
  background: #ff5252; color: #fff; border: none;
  font-size: 14px; font-weight: 700;
  display: none; align-items: center; justify-content: center;
  cursor: pointer; z-index: 5; line-height: 1;
}
.song-item.show-delete .delete-btn { display: flex; }
.song-item.show-delete { padding-right: 44px; }
.upload-btn {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px; margin-top: 8px;
  border: 2px dashed #ddd; border-radius: 14px;
  background: none; cursor: pointer;
  font-size: 13px; color: #999; transition: all .2s;
}
.upload-btn:active { border-color: #ff9800; color: #ff9800; }
.upload-btn .upload-icon { font-size: 20px; }
</style>
</head>
<body>

<div class="wallpaper"></div>
<div class="watermark">小茗o3o</div>
<div class="concert-overlay" id="concertOverlay"></div>
<div class="stage-lights" id="stageLights">
  <div class="light-beam"></div><div class="light-beam"></div><div class="light-beam"></div><div class="light-beam"></div><div class="light-beam"></div>
  <div class="spotlight"></div>
</div>
<div class="music-notes" id="musicNotes"></div>
<div class="crowd" id="crowd"></div>

<audio id="bgMusic"></audio>
<input type="file" class="audio-file-input" id="audioFile" accept="audio/mpeg,audio/mp3,audio/wav,audio/m4a,audio/ogg,audio/flac,.mp3,.wav,.m4a,.ogg,.flac">

<div class="stage" id="stage">
  <div class="bubu idle" id="bubu">
    <div class="zzz" id="zzz"><span>Z</span><span>z</span><span>z</span></div>
    <div class="hearts" id="hearts"></div>
    <div class="food" id="food"></div>
    <img src="bubu.png" alt="卜卜" id="bubuImg">
    <div class="microphone" id="microphone"><div class="mic-head"></div><div class="mic-handle"></div></div>
    <div class="bubble" id="bubble"></div>
  </div>
</div>

<div class="status-panel" id="statusPanel">
  <div class="drag-handle">⋮⋮</div>
  <div class="row"><span>😊 心情</span><span id="moodText">60</span></div>
  <div class="bar"><div class="bar-fill mood" id="moodBar" style="width:60%"></div></div>
  <div class="row"><span>🍖 饱腹</span><span id="fullText">60</span></div>
  <div class="bar"><div class="bar-fill full" id="fullBar" style="width:60%"></div></div>
  <div class="row"><span>🥕 卜币</span><span id="coinsText">5</span></div>
  <div class="row"><span>⚡ 精力</span><span id="energyText">4</span></div>
</div>

<div class="hint" id="hint">
  <div class="hint-title">🥕 欢迎来到卜卜的小世界</div>

<script>
// ===== 状态 =====
let state = { mood:60, fullness:60, x:.5, y:.5, direction:1, skin:'default', sleeping:false, dragging:false, coins:5, energy:4, bubuScale:1 };
const SKINS = {
  default: 'bubu.png', panda: 'skin-panda.png',
  'miao-boy': 'skin-miao-boy.png',
  turban: 'skin-turban.png'
};
// 立即预加载所有皮肤图片，确保切换时零延迟
const _skinCache = {};
Object.values(SKINS).forEach(src => { const img = new Image(); img.src = src; _skinCache[src] = img; });
const bubu = document.getElementById('bubu');
const bubuImg = document.getElementById('bubuImg');
const bubble = document.getElementById('bubble');
const stage = document.getElementById('stage');
const heartsEl = document.getElementById('hearts');
const foodEl = document.getElementById('food');
let walkTimer, decayTimer, bubbleTimer;

function loadState() {
  try { const s=localStorage.getItem('bubu_state'); if(s) state={...state,...JSON.parse(s)}; } catch(e){}
  applyState();
}
function saveState() { try { localStorage.setItem('bubu_state',JSON.stringify(state)); } catch(e){} }

function applyState() {
  updateBars(); moveBubu(state.x,state.y,false); setSkin(state.skin,false);
  if(state.direction<0) bubu.classList.add('flip-x');
  applyBubuScale();
}
// 应用卜卜缩放（同时影响气泡）
function applyBubuScale() {
  const s = state.bubuScale || 1;
  bubu.style.width = (140 * s) + 'px';
  bubu.style.height = (186 * s) + 'px';
  // 气泡等比缩放
  bubble.style.fontSize = (12 * s) + 'px';
  bubble.style.padding = (6 * s) + 'px ' + (13 * s) + 'px';
  bubble.style.borderRadius = (15 * s) + 'px';
}
function moveBubu(nx,ny,animate=true) {
  state.x=Math.max(.08,Math.min(.92,nx)); state.y=Math.max(.08,Math.min(.85,ny));
  if(animate&&Math.abs(nx-state.x)>.001) {
    state.direction=nx>state.x?1:-1; bubu.classList.toggle('flip-x',state.direction<0);
  }
  bubu.style.left=(state.x*100)+'%'; bubu.style.top=(state.y*100)+'%'; saveState();
}

// ===== 双指缩放（卜卜 + 气泡 + 歌词） =====
let pinchInitialDist = 0;
let pinchInitialScale = 1;
let pinchInitialLyricScale = 1;
let isPinching = false;

function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

stage.addEventListener('touchstart', function(e) {
  if (e.touches.length === 2) {
    // 双指触摸时取消单指拖拽
    state.dragging = false;
    bubu.classList.remove('dragging');
    bubu.classList.add('idle');
    clearTimeout(longPressTimer);
    isPinching = true;
    pinchInitialDist = getPinchDist(e.touches);
    pinchInitialScale = state.bubuScale || 1;
    pinchInitialLyricScale = lyricSettings_.scale || 1;
    e.preventDefault();
  }
}, {passive: false});

stage.addEventListener('touchmove', function(e) {
  if (e.touches.length === 2 && isPinching) {
    e.preventDefault();
    const dist = getPinchDist(e.touches);
    const ratio = dist / pinchInitialDist;
    // 卜卜缩放：0.5 ~ 3
    let newScale = Math.max(0.5, Math.min(3, pinchInitialScale * ratio));
    state.bubuScale = newScale;
    applyBubuScale();
    // 歌词缩放同步
    let newLyricScale = Math.max(0.5, Math.min(2.5, pinchInitialLyricScale * ratio));
    lyricSettings_.scale = newLyricScale;
    applyLyricStyle();
    saveState();
    saveLyricSettings();
  }
}, {passive: false});

stage.addEventListener('touchend', function(e) {
  if (e.touches.length < 2) {
    isPinching = false;
  }
}, {passive: false});

let dragStartX,dragStartY,bubuStartX,bubuStartY,longPressTimer;
function onPointerDown(e) {
  if(e.target.closest('.toolbar')||e.target.closest('.status-panel')||e.target.closest('.lyric-bubble')||e.target.closest('.lyric-settings')) return;
  state.dragging=true; bubu.classList.add('dragging'); bubu.classList.remove('idle');
  const r=stage.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  dragStartX=cx; dragStartY=cy;
  bubuStartX=state.x*r.width; bubuStartY=state.y*r.height;
  longPressTimer=setTimeout(()=>{ if(state.dragging&&Math.abs(cx-dragStartX)<10&&Math.abs(cy-dragStartY)<10) pet(); },500);
}
function onPointerMove(e) {
  if(!state.dragging) return;
  const r=stage.getBoundingClientRect();
  const cx=e.touches?e.touches[0].clientX:e.clientX;
  const cy=e.touches?e.touches[0].clientY:e.clientY;
  if(Math.abs(cx-dragStartX)>10||Math.abs(cy-dragStartY)>10) clearTimeout(longPressTimer);
  const nx=(bubuStartX+cx-dragStartX)/r.width;
  const ny=(bubuStartY+cy-dragStartY)/r.height;
  bubu.style.left=(Math.max(.08,Math.min(.92,nx))*100)+'%';
  bubu.style.top=(Math.max(.08,Math.min(.85,ny))*100)+'%';
}
function onPointerUp(e) {
  if(!state.dragging) return;
  clearTimeout(longPressTimer);
  state.dragging=false; bubu.classList.remove('dragging'); bubu.classList.add('idle');
  const cx=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
  const cy=e.changedTouches?e.changedTouches[0].clientY:e.clientY;
  const dx=cx-dragStartX,dy=cy-dragStartY;
  if(Math.abs(dx)<10&&Math.abs(dy)<10) { tapReact(); return; }
  state.x=parseFloat(bubu.style.left)/100; state.y=parseFloat(bubu.style.top)/100; saveState();
}
bubu.addEventListener('mousedown',onPointerDown);
bubu.addEventListener('touchstart',onPointerDown,{passive:false});
window.addEventListener('mousemove',onPointerMove);
window.addEventListener('touchmove',onPointerMove,{passive:false});
window.addEventListener('mouseup',onPointerUp);
window.addEventListener('touchend',onPointerUp);
bubu.addEventListener('dragstart',e=>e.preventDefault());

function tapReact() {
  if(state.sleeping){ wakeUp(); return; }
  showBubble(['會不會累啊～很簡單對不對 (◡‿◡✿)','那現在再弄快一點好不好啊 (｡•̀ᴗ-)✧','說好不說啦 (￣ε￣)','哥哥手会酸的～ (｡•́︿•̀｡)','快點！來不及啦 (ﾟДﾟ;≡;ﾟДﾟ)','我們都是五月天！(๑•̀ㅂ•́)و✧','一起唱到80歲！٩(ˊᗜˋ*)و🎶','盒盒盒盒盒 (*≧∀≦*)'].random());
  bounce();
}
function feed(emoji,name,cost,fullnessGain,msg) {
  if(state.sleeping) wakeUp();
  // 检查币够不够
  if (state.coins < cost) {
    showBubble('卜卜幣不夠了啦… 聽完一首歌再來餵我嘛 (´；ω；`)');
    closeFood();
    return;
  }
  state.coins -= cost;
  state.fullness=Math.min(100,state.fullness+fullnessGain); addMood(3);
  showBubble(msg||(name+' 超讚的啦！(๑´ڡ`๑)')); spawnFood(emoji);
  bounce(); saveState(); updateBars(); closeFood();
}
function pet() {
  if(state.sleeping) wakeUp();
  if (state.energy < 2) {
    showBubble('沒有精力了捏… 聽完一首歌就有精力了喔 (◍•ᴗ•◍)');
    return;
  }
  state.energy -= 2;
  state.mood=Math.min(100,state.mood+3); showBubble('好蘇胡喔～ ♡(´∀｀)人(´∀｀)♡'); spawnHearts(4); bounce(); saveState(); updateBars();
}
function play() {
  if(state.sleeping) wakeUp();
  if (state.energy < 1) {
    showBubble('沒有精力了捏… 聽完一首歌就有精力了喔 (◍•ᴗ•◍)');
    return;
  }
  state.energy -= 1;
  state.mood=Math.min(100,state.mood+1); showBubble('一起玩啦！٩(˃̶͈̀௰˂̶͈́)و'); bounce(); randomWalk(); saveState(); updateBars();
}
function addMood(n){ state.mood=Math.min(100,state.mood+n); }
function wakeUp() { state.sleeping=false; bubu.classList.remove('sleeping'); showBubble('睡飽了～早安喔 (◍•ᴗ•◍)'); saveState(); }
function bounce() {
  bubu.classList.remove('idle'); bubu.classList.add('bouncing');
  setTimeout(()=>{ bubu.classList.remove('bouncing'); if(!state.dragging) bubu.classList.add('idle'); },600);
}
function showBubble(text) {
  bubble.textContent=text; bubble.classList.add('show');
  clearTimeout(bubbleTimer); bubbleTimer=setTimeout(()=>bubble.classList.remove('show'),1800);
}
function spawnHearts(count) {
  for(let i=0;i<count;i++) setTimeout(()=>{
    const h=document.createElement('div'); h.className='heart'; h.textContent='❤️';
    h.style.setProperty('--tx',(Math.random()*50-25)+'px'); h.style.left=(Math.random()*20-10)+'px';
    heartsEl.appendChild(h); setTimeout(()=>h.remove(),1300);
  },i*120);
}
function spawnFood(emoji) {
  emoji = emoji || '🥕';
  const f=document.createElement('div'); f.className='food'; f.textContent=emoji;
  f.style.left='50%'; foodEl.appendChild(f); setTimeout(()=>f.remove(),800);
}
function updateBars() {
  document.getElementById('moodBar').style.width=state.mood+'%';
  document.getElementById('fullBar').style.width=state.fullness+'%';
  document.getElementById('moodText').textContent=Math.round(state.mood);
  document.getElementById('fullText').textContent=Math.round(state.fullness);
  document.getElementById('coinsText').textContent=state.coins;
  document.getElementById('energyText').textContent=state.energy;
  updateBubuGrayscale();
}
// 心情和饱腹感都≥60 = 正常颜色；任一个<60 逐渐变黑白；任一个≤20 = 完全黑白
function updateBubuGrayscale() {
  const minVal = Math.min(state.mood, state.fullness);
  let gray = 0;
  if (minVal <= 20) gray = 1;
  else if (minVal < 60) gray = (60 - minVal) / 40; // 线性从 0 到 1
  bubuImg.style.filter = `drop-shadow(0 8px 20px rgba(0,0,0,0.12)) grayscale(${gray})`;
}
function randomWalk() {
  if(state.dragging||state.sleeping) return;
  const nx=Math.random()*.75+.12,ny=Math.random()*.6+.15;
  state.direction=nx>state.x?1:-1; bubu.classList.toggle('flip-x',state.direction<0);
  moveBubu(nx,ny,true);
}
function tick() {
  if(state.dragging) return;
  // 饱腹每1.5小时降20点，tick每30秒执行，每次减20/(1.5*120)=20/180≈0.111
  state.fullness=Math.max(0,state.fullness-0.111);
  // 心情每1小时降20点，每次减20/120≈0.167
  if(state.mood>0) state.mood=Math.max(0,state.mood-0.167);
  if(state.fullness<25&&Math.random()>.7) showBubble('肚子餓了啦… (´；ω；`)');
  if(state.fullness>50&&state.mood<40&&!state.sleeping&&Math.random()>.8) {
    state.sleeping=true; bubu.classList.add('sleeping'); showBubble('Zzz… 好睏喔…');
  }
  updateBars(); saveState();
}
function toggleDress() { document.getElementById('dressModal').classList.toggle('open'); }
function closeDress(e) { if(e.target.id==='dressModal') toggleDress(); }
// 换装事件委托
document.getElementById('dressGrid').addEventListener('click', function(e) {
  const item = e.target.closest('.dress-item');
  if (!item) return;
  setSkin(item.dataset.skin);
});
function toggleFood() { document.getElementById('foodModal').classList.toggle('open'); }
function closeFood(e) { if(e.target.id==='foodModal') { document.getElementById('foodModal').classList.remove('open'); } }
function setSkin(type,save=true) {
  state.skin=type;
  // 用缓存的图片对象直接设置src，避免重新加载解码
  const src = SKINS[type];
  if (_skinCache[src] && _skinCache[src].complete) {
    bubuImg.src = src;
  } else {
    bubuImg.src = src;
  }
  document.querySelectorAll('.dress-item').forEach(el=>{ el.classList.toggle('active',el.dataset.skin===type); });
  if(save) saveState();
}
Array.prototype.random=function(){ return this[Math.floor(Math.random()*this.length)]; };

loadState();
decayTimer=setInterval(tick,30000);
setTimeout(()=>showBubble('嗨～我是卜卜啦 (◕‿◕✿)'),500);

// ===== 提示弹窗：用户手动关闭，不自动消失 =====

// ===== 心情/饱腹值面板：可拖拽 =====
const statusPanel = document.getElementById('statusPanel');
let spDragging = false, spStartX, spStartY, spOrigLeft, spOrigTop;
function spDown(e) {
  spDragging = true; statusPanel.classList.add('dragging');
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  spStartX = cx; spStartY = cy;
  spOrigLeft = statusPanel.offsetLeft; spOrigTop = statusPanel.offsetTop;
  const rect = statusPanel.getBoundingClientRect();
  statusPanel.style.right = 'auto'; statusPanel.style.top = rect.top + 'px';
  statusPanel.style.left = rect.left + 'px'; statusPanel.style.position = 'fixed';
  e.preventDefault();
}
function spMove(e) {
  if (!spDragging) return;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  statusPanel.style.left = Math.max(0, Math.min(window.innerWidth - statusPanel.offsetWidth, spOrigLeft + cx - spStartX)) + 'px';
  statusPanel.style.top = Math.max(0, Math.min(window.innerHeight - statusPanel.offsetHeight, spOrigTop + cy - spStartY)) + 'px';
  e.preventDefault();
}
function spUp() {
  if (!spDragging) return;
  spDragging = false; statusPanel.classList.remove('dragging');
  try { localStorage.setItem('status_panel_pos', JSON.stringify({ left: statusPanel.style.left, top: statusPanel.style.top })); } catch(e) {}
}
statusPanel.addEventListener('mousedown', spDown);
statusPanel.addEventListener('touchstart', spDown, {passive: false});
window.addEventListener('mousemove', spMove);
window.addEventListener('touchmove', spMove, {passive: false});
window.addEventListener('mouseup', spUp);
window.addEventListener('touchend', spUp);
try {
  const saved = JSON.parse(localStorage.getItem('status_panel_pos'));
  if (saved && saved.left && saved.top) { statusPanel.style.right = 'auto'; statusPanel.style.left = saved.left; statusPanel.style.top = saved.top; }
} catch(e) {}

// ===== 歌曲管理 =====
// 内置歌曲（不可删除）
const BUILTIN_SONGS = {
  haohao: { id:'haohao', file:'haohao-song.mp3', title:'好好（想把你写成一首歌）', icon:'💛', artist:'五月天', builtin:true },
  yuehan: { id:'yuehan', file:'yuehan-lannong.mp3', title:'约翰蓝侬', icon:'🎸', artist:'五月天', builtin:true },
  pingguo: { id:'pingguo', file:'yike-pingguo.mp3', title:'一颗苹果', icon:'🍎', artist:'五月天', builtin:true },
  ruyan: { id:'ruyan', file:'ruyan-song.mp3', title:'如烟', icon:'🚬', artist:'五月天', builtin:true },
  chunzhen: { id:'chunzhen', file:'chunzhen-song.mp3', title:'纯真', icon:'🌟', artist:'五月天', builtin:true },
  cangjie: { id:'cangjie', file:'cangjie-song.mp3', title:'仓颉', icon:'✍️', artist:'五月天', builtin:true },
  tianshi: { id:'tianshi', file:'tianshi-song.mp3', title:'天使', icon:'🪽', artist:'五月天', builtin:true }
};
const SONG_ORDER = ['haohao','yuehan','pingguo','ruyan','chunzhen','cangjie','tianshi'];

// 从 localStorage 加载自定义歌曲
function loadCustomSongs() {
  try {
    const saved = JSON.parse(localStorage.getItem('custom_songs'));
    return saved || [];
  } catch(e) { return []; }
}
function saveCustomSongs(list) {
  try { localStorage.setItem('custom_songs', JSON.stringify(list)); } catch(e) {}
}

function getAllSongs() {
  const builtin = SONG_ORDER.map(id => BUILTIN_SONGS[id]);
  const custom = loadCustomSongs();
  return [...builtin, ...custom];
}

function getSongById(songId) {
  if (BUILTIN_SONGS[songId]) return BUILTIN_SONGS[songId];
  const custom = loadCustomSongs();
  return custom.find(s => s.id === songId);
}

// 渲染歌曲列表
function renderSongList() {
  const container = document.getElementById('songListContainer');
  const songs = getAllSongs();
  container.innerHTML = songs.map(s => {
    const isPlaying = currentSong === s.id && musicPlaying;
    const isLoading = currentSong === s.id && !musicPlaying;
    return `<div class="song-item${isPlaying?' playing':''}" data-song="${s.id}">
      <span class="song-icon">${s.icon}</span>
      <div class="song-info">
        <span class="song-title">${s.title}</span>
        <span class="song-artist">${s.artist||'未知'}</span>
      </div>
      <span class="song-status">${isPlaying?'♪ 播放中':''}${isLoading?'加载中…':''}</span>
      ${s.builtin ? '' : `<button class="delete-btn">✕</button>`}
    </div>`;
  }).join('');
}

// ===== 歌曲列表事件委托 =====
document.getElementById('songListContainer').addEventListener('click', function(e) {
  // 点击删除按钮
  if (e.target.classList.contains('delete-btn')) {
    const item = e.target.closest('.song-item');
    if (item) deleteSong(item.dataset.song);
    return;
  }
  // 点击歌曲项
  const item = e.target.closest('.song-item');
  if (!item) return;
  const songId = item.dataset.song;
  if (item.classList.contains('show-delete')) {
    item.classList.remove('show-delete');
    return;
  }
  selectSong(songId);
});

// 长按检测（移动端）
let songLongPressTimer;
document.getElementById('songListContainer').addEventListener('touchstart', function(e) {
  const item = e.target.closest('.song-item');
  if (!item) return;
  const songId = item.dataset.song;
  songLongPressTimer = setTimeout(() => {
    toggleSongDelete(songId);
  }, 600);
}, {passive: true});
document.getElementById('songListContainer').addEventListener('touchend', function() {
  clearTimeout(songLongPressTimer);
});
document.getElementById('songListContainer').addEventListener('touchmove', function() {
  clearTimeout(songLongPressTimer);
});

function toggleSongDelete(songId) {
  clearTimeout(songLongPressTimer);
  const item = document.querySelector(`.song-item[data-song="${songId}"]`);
  if (!item) return;
  // 关闭其他
  document.querySelectorAll('.song-item.show-delete').forEach(el => {
    if (el.dataset.song !== songId) el.classList.remove('show-delete');
  });
  item.classList.toggle('show-delete');
}

function deleteSong(songId) {
  const song = getSongById(songId);
  if (!song || song.builtin) return;
  if (!confirm(`确定删除「${song.title}」吗？`)) return;
  
  // 如果正在播放这首歌，先停止
  if (currentSong === songId) {
    bgMusic.pause(); musicPlaying = false; currentSong = null;
    clearInterval(lyricTimer); lyricBubble.classList.remove('show');
    musicIcon.textContent = '🎵'; musicLabel.textContent = '选择歌曲';
    musicCtrl.classList.remove('playing');
  }
  
  let custom = loadCustomSongs();
  custom = custom.filter(s => s.id !== songId);
  saveCustomSongs(custom);
  renderSongList();
}

function applyLyricStyle() {
  document.documentElement.style.setProperty('--lyric-font-size', lyricSettings_.fontSize + 'px');

  document.getElementById('bgColorSwatch').style.background = lyricSettings_.bgColor;
  document.getElementById('scaleVal').textContent = Math.round(lyricSettings_.scale * 100) + '%';

function toHex(c) {
  if (c.startsWith('#')) return c;
  const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#000000';
  return '#' + [m[1],m[2],m[3]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
}
function toRgba(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},0.75)`;
}

        bgMusic.src = song.file; bgMusic.load();
        bgMusic.play().then(() => {
          musicPlaying = true; musicIcon.textContent = '🎵';
          musicLabel.textContent = song.title; musicCtrl.classList.add('playing');
          renderSongList(); startLyricSync(songId);
          document.getElementById('musicModal').classList.remove('open');
        }).catch(() => {});
      }).catch(() => { alert('播放失败，请再点一次哦～'); });
    });
  }
}

function startLyricSync(songId) {
  clearInterval(lyricTimer); lyricBubble.classList.remove('show');
  const lrc = LYRICS[songId];
  if (!lrc) return;
  lastLyricLine = '';
  lyricTimer = setInterval(() => {
    if (!musicPlaying) return;
    const t = bgMusic.currentTime;
    // 天使提前 0.25 秒，其他歌提前 0.5 秒
    const lookahead = t + (songId === 'tianshi' ? 0.25 : 0.5);
    let currentLine = null;
    for (let i = 0; i < lrc.length; i++) {
      if (lrc[i][0] <= lookahead) currentLine = lrc[i][1];
    }
    if (!currentLine) {
      const idleEmojis = ['♪～ (◕‿◕✿)', '♫ 聽歌中… (´▽`ʃ♡ƪ)', '🎵～ 好好聽捏～'];
      currentLine = idleEmojis[Math.floor(t / 5) % idleEmojis.length];
    }
    if (currentLine !== lastLyricLine) {
      lastLyricLine = currentLine;
      if (concertMode) {
        bubble.textContent = currentLine; bubble.classList.add('show');
        clearTimeout(bubbleTimer); lyricBubble.classList.remove('show');
      } else {
        lyricBubble.textContent = currentLine; lyricBubble.classList.add('show');
      }
    }
  }, 250);
}

// 自定义上传
audioFile.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const url = URL.createObjectURL(file);
  const displayName = file.name.replace(/\.(mp3|m4a|wav|flac|ogg)$/i,'');
  const songId = 'custom_' + Date.now();
  
  // 先加入歌曲列表
  const custom = loadCustomSongs();
  custom.push({ id: songId, file: url, title: displayName, icon: '📁', artist: '自定义', builtin: false });
  saveCustomSongs(custom);
  
  // 播放
  bgMusic.src = url; bgMusic.load();
  musicLoaded = true; currentSong = songId;
  bgMusic.play().then(() => {
    musicPlaying = true; musicIcon.textContent = '🎵';
    musicLabel.textContent = displayName; musicCtrl.classList.add('playing');
    clearInterval(lyricTimer); lyricBubble.classList.remove('show');
    document.getElementById('musicModal').classList.remove('open');
    renderSongList();
  }).catch(() => {
    setTimeout(() => {
      bgMusic.play().then(() => {
        musicPlaying = true; musicIcon.textContent = '🎵';
        musicLabel.textContent = displayName; musicCtrl.classList.add('playing');
        document.getElementById('musicModal').classList.remove('open');
        renderSongList();
      }).catch(() => { alert('播放失败，再试一次哦～'); });
    }, 200);
  });
});

bgMusic.addEventListener('ended', () => {
  if (!musicPlaying || !currentSong) return;
  // 听完一首完整歌曲：奖励 5 币 + 4 精力
  state.coins += 5;
  state.energy += 4;
  updateBars(); saveState();
  
  if (playMode === 'repeat') {
    bgMusic.currentTime = 0; bgMusic.play();
    if (currentSong) startLyricSync(currentSong);
  } else {
    playNextSong();
  }
});

musicCtrl.addEventListener('dblclick', (e) => { e.stopPropagation(); volumeBarWrap.classList.toggle('show'); });
volumeSlider.addEventListener('input', () => { bgMusic.volume = volumeSlider.value/100; volumeVal.textContent = volumeSlider.value; });

// ===== 播放模式切换 =====
function togglePlayMode() {
  playMode = playMode === 'repeat' ? 'list' : 'repeat';
  updatePlayModeUI();
  try { localStorage.setItem('play_mode', playMode); } catch(e) {}
}
function updatePlayModeUI() {
  if (playMode === 'repeat') {
    document.getElementById('playModeIcon').textContent = '🔂';
    document.getElementById('playModeText').textContent = '单曲循环';
  } else {
    document.getElementById('playModeIcon').textContent = '🔀';
    document.getElementById('playModeText').textContent = '列表顺序';
  }
}
function playNextSong() {
  const allSongs = getAllSongs();
  if (allSongs.length === 0) { bgMusic.currentTime = 0; bgMusic.play(); return; }
  const idx = allSongs.findIndex(s => s.id === currentSong);
  const nextIdx = idx < 0 ? 0 : (idx + 1) % allSongs.length;
  const song = allSongs[nextIdx];
  bgMusic.src = song.file; currentSong = song.id;
  bgMusic.play().then(() => {
    musicPlaying = true; musicIcon.textContent = '🎵';
    musicLabel.textContent = song.title; musicCtrl.classList.add('playing');
    renderSongList();
    if (LYRICS[song.id]) startLyricSync(song.id);
    else { clearInterval(lyricTimer); lyricBubble.classList.remove('show'); }
  }).catch(() => {});
}

try {
  const saved = localStorage.getItem('play_mode');
  if (saved === 'list' || saved === 'repeat') playMode = saved;
} catch(e) {}
updatePlayModeUI();

// ===== 歌词气泡可拖拽 =====
let lbDragging = false, lbStartX, lbStartY, lbOrigLeft, lbOrigTop, lbOrigW, lbOrigH;
function lbDown(e) {
  if (concertMode) return;
  lbDragging = true; lyricBubble.classList.add('dragging');
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  lbStartX = cx; lbStartY = cy;
  const rect = lyricBubble.getBoundingClientRect();
  lbOrigW = rect.width; lbOrigH = rect.height;
  lyricBubble.style.width = lbOrigW + 'px'; lyricBubble.style.height = lbOrigH + 'px';
  lyricBubble.style.left = rect.left + 'px'; lyricBubble.style.top = rect.top + 'px';
  lyricBubble.style.transform = 'none'; lyricBubble.style.bottom = 'auto';
  lbOrigLeft = rect.left; lbOrigTop = rect.top;
  e.preventDefault(); e.stopPropagation();
}
function lbMove(e) {
  if (!lbDragging) return;
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  lyricBubble.style.left = Math.max(0, Math.min(window.innerWidth - lbOrigW, lbOrigLeft + cx - lbStartX)) + 'px';
  lyricBubble.style.top = Math.max(0, Math.min(window.innerHeight - lbOrigH, lbOrigTop + cy - lbStartY)) + 'px';
  e.preventDefault();
}
function lbUp() {
  if (!lbDragging) return;
  lbDragging = false; lyricBubble.classList.remove('dragging');
  lyricBubble.style.width = ''; lyricBubble.style.height = '';
  try { localStorage.setItem('lyric_bubble_pos', JSON.stringify({ left: lyricBubble.style.left, top: lyricBubble.style.top })); } catch(e) {}
}
lyricBubble.addEventListener('mousedown', lbDown);
lyricBubble.addEventListener('touchstart', lbDown, {passive: false});
window.addEventListener('mousemove', lbMove);
window.addEventListener('touchmove', lbMove, {passive: false});
window.addEventListener('mouseup', lbUp);
window.addEventListener('touchend', lbUp);
try {
  const saved = JSON.parse(localStorage.getItem('lyric_bubble_pos'));
  if (saved && saved.left && saved.top) { lyricBubble.style.left = saved.left; lyricBubble.style.top = saved.top; lyricBubble.style.transform = 'none'; }
} catch(e) {}

// 双击歌词气泡显示/隐藏设置栏
lyricBubble.addEventListener('dblclick', function(e) {
  e.stopPropagation();
  lyricSettings.classList.toggle('show');
  const lbRect = lyricBubble.getBoundingClientRect();
  lyricSettings.style.left = Math.min(lbRect.left, window.innerWidth - 320) + 'px';
  lyricSettings.style.top = (lbRect.bottom + 6) + 'px';
});

// ========== 演唱会模式 ==========
const concertOverlay = document.getElementById('concertOverlay');
const stageLights = document.getElementById('stageLights');
const musicNotes = document.getElementById('musicNotes');
const crowd = document.getElementById('crowd');
const microphone = document.getElementById('microphone');
let concertMode = false;
let concertTimer;

function toggleConcert() { concertMode = !concertMode; concertMode ? startConcert() : stopConcert(); }

function startConcert() {
  bubu.classList.add('concert-mode'); stage.classList.add('concert-mode-stage');
  concertOverlay.classList.add('on'); stageLights.classList.add('on');
  microphone.classList.add('show'); crowd.classList.add('on');
  lyricBubble.classList.add('concert-hidden'); lyricBubble.classList.remove('show');
  lyricSettings.classList.remove('show');
  generateCrowd();
  if (!musicPlaying && musicLoaded) {
    bgMusic.play().then(() => { musicPlaying = true; musicCtrl.classList.add('playing'); musicIcon.textContent = '🎵'; }).catch(()=>{});
  }
  spawnNotes();
  concertTimer = setInterval(() => { spawnNotes(); }, 3000);
  if (!musicPlaying) showBubble('演唱會開始！🎤 (◕‿◕✿)');
}
function stopConcert() {
  bubu.classList.remove('concert-mode'); stage.classList.remove('concert-mode-stage');
  concertOverlay.classList.remove('on'); stageLights.classList.remove('on');
  microphone.classList.remove('show'); crowd.classList.remove('on');
  crowd.innerHTML = ''; clearInterval(concertTimer);
  bubble.classList.remove('show');
  lyricBubble.classList.remove('concert-hidden');
  if (musicPlaying && currentSong) lyricBubble.classList.add('show');
  showBubble('謝謝大家～下次見！(´▽`ʃ♡ƪ)');
}
function generateCrowd() {
  crowd.innerHTML = '';
  const colors = ['#ff1744','#00e5ff','#ffea00','#76ff03','#d500f9','#ff9100','#e040fb','#18ffff'];
  for (let i = 0; i < 60; i++) {
    const gs = document.createElement('div'); gs.className = 'glowstick';
    gs.style.left = (Math.random()*95)+'%'; gs.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
    gs.style.animationDelay = (Math.random()*1)+'s'; gs.style.animationDuration = (0.5+Math.random()*1.5)+'s';
    crowd.appendChild(gs);
  }
}
function spawnNotes() {
  const notes = ['🎵','🎶','🎼','♪','♫','🎤','✨','💫'];
  for (let i = 0; i < 5; i++) setTimeout(() => {
    const note = document.createElement('div'); note.className = 'note-particle';
    note.textContent = notes[Math.floor(Math.random()*notes.length)];
    note.style.left = (20 + Math.random()*60)+'%'; note.style.top = (40 + Math.random()*40)+'%';
    note.style.setProperty('--nx', (Math.random()*100-50)+'px');
    note.style.setProperty('--nr', (Math.random()*60-30)+'deg');
    note.style.animationDuration = (2+Math.random()*3)+'s';
    musicNotes.appendChild(note); setTimeout(() => note.remove(), 4000);
  }, i*200);
}

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

// ===== 页面恢复可见时，立即追上当前播放进度 =====
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && musicPlaying && currentSong) {
    // 重置 lastLine，强制下一轮同步立即更新歌词
    if (typeof lastLyricLine !== 'undefined') lastLyricLine = '';
    // 立即手动触发一次歌词同步
    syncLyricOnce(currentSong);
  }
});

// 立即同步一次歌词（不依赖 setInterval）
let lastLyricLine = '';
function syncLyricOnce(songId) {
  const lrc = LYRICS[songId];
  if (!lrc || !musicPlaying) return;
  const t = bgMusic.currentTime;
  const lookahead = t + (songId === 'tianshi' ? 0.25 : 0.5);
  let currentLine = null;
  for (let i = 0; i < lrc.length; i++) {
    if (lrc[i][0] <= lookahead) currentLine = lrc[i][1];
  }
  if (!currentLine) {
    const idleEmojis = ['♪～ (◕‿◕✿)', '♫ 聽歌中… (´▽`ʃ♡ƪ)', '🎵～ 好好聽捏～'];
    currentLine = idleEmojis[Math.floor(t / 5) % idleEmojis.length];
  }
  if (currentLine !== lastLyricLine) {
    lastLyricLine = currentLine;
    if (concertMode) {
      bubble.textContent = currentLine; bubble.classList.add('show');
      clearTimeout(bubbleTimer); lyricBubble.classList.remove('show');
    } else {
      lyricBubble.textContent = currentLine; lyricBubble.classList.add('show');
    }
  }
}
</script>
